<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo Negro Carbón (#1c1b1b) con bordes suaves -->
  <rect width="512" height="512" rx="112" fill="#1c1b1b" />
  
  <!-- Monograma B! con margen respirable ("aire") y centrado visual óptimo a -15° -->
  <g transform="rotate(-15 256 256)">
    <text x="195" y="388" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="360" font-weight="900" text-anchor="middle" fill="#ffffff">B</text>
    <text x="360" y="388" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="360" font-weight="900" text-anchor="middle" fill="#ff4f00">!</text>
  </g>
</svg>
